[project]
name = "data-agent"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "aiomysql>=0.3.2",
    "aiosqlite>=0.22.1",
    "asyncmy>=0.2.11",
    "cryptography>=46.0.4",
    "dashscope>=1.25.17",
    "elasticsearch[async]>=8,<9",
    "fastapi[standard]>=0.128.0",
    "filesafe>=0.2",
    "huggingface-hub>=0.36.0",
    "jieba>=0.42.1",
    "langchain>=1.2.7",
    "langchain-community>=0.4.1",
    "langchain-deepseek>=1.0.1",
    "langchain-huggingface>=1.2.0",
    "langgraph>=1.0.7",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "langsmith>=0.6.6",
    "loguru>=0.7.3",
    "omegaconf>=2.3.0",
    "pyfailsafe>=0.6.0",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.16.2",
    "sqlalchemy>=2.0.46",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
