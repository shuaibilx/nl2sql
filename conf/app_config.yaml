# Application configuration. Secrets are read from environment variables or .env.

logging:
  file:
    enable: true
    level: INFO
    path: logs
    rotation: "10 MB"
    retention: "7 days"
  console:
    enable: true
    level: INFO

db_meta:
  host: ${oc.env:DB_META_HOST,localhost}
  port: ${oc.env:DB_META_PORT,3306}
  user: ${oc.env:DB_META_USER,atguigu}
  password: ${oc.env:DB_META_PASSWORD,''}
  database: ${oc.env:DB_META_DATABASE,meta}

db_dw:
  host: ${oc.env:DB_DW_HOST,localhost}
  port: ${oc.env:DB_DW_PORT,3306}
  user: ${oc.env:DB_DW_USER,atguigu}
  password: ${oc.env:DB_DW_PASSWORD,''}
  database: ${oc.env:DB_DW_DATABASE,dw}

qdrant:
  host: ${oc.env:QDRANT_HOST,localhost}
  port: ${oc.env:QDRANT_PORT,6333}
  embedding_size: ${oc.env:QDRANT_EMBEDDING_SIZE,1024}

embedding:
  host: ${oc.env:EMBEDDING_HOST,localhost}
  port: ${oc.env:EMBEDDING_PORT,8081}
  model: ${oc.env:EMBEDDING_MODEL,BAAI/bge-large-zh-v1.5}

es:
  host: ${oc.env:ES_HOST,localhost}
  port: ${oc.env:ES_PORT,9200}
  index_name: ${oc.env:ES_INDEX_NAME,data_agent}

llm:
  model_name: ${oc.env:LLM_MODEL_NAME,mimo-v2.5}
  api_key: ${oc.env:LLM_API_KEY,missing}
  base_url: ${oc.env:LLM_BASE_URL,https://api.xiaomimimo.com/v1}

llm_fallback:
  model_name: ${oc.env:LLM_FALLBACK_MODEL_NAME,deepseek-v4-flash}
  api_key: ${oc.env:LLM_FALLBACK_API_KEY,missing}
  base_url: ${oc.env:LLM_FALLBACK_BASE_URL,https://api.deepseek.com}

cache:
  backend: ${oc.env:CACHE_BACKEND,redis}
  env: ${oc.env:CACHE_ENV,dev}
  key_prefix: ${oc.env:CACHE_KEY_PREFIX,nl2sql}
  fail_fast: ${oc.env:CACHE_FAIL_FAST,false}
  stale_ttl_seconds: ${oc.env:CACHE_STALE_TTL_SECONDS,1800}
  semantic_enabled: ${oc.env:CACHE_SEMANTIC_ENABLED,true}
  semantic_threshold: ${oc.env:CACHE_SEMANTIC_THRESHOLD,0.94}
  semantic_max_entries: ${oc.env:CACHE_SEMANTIC_MAX_ENTRIES,1024}
  semantic_ttl_seconds: ${oc.env:CACHE_SEMANTIC_TTL_SECONDS,7200}
  ttl_embedding_seconds: ${oc.env:CACHE_TTL_EMBEDDING_SECONDS,86400}
  ttl_llm_cleanup_seconds: ${oc.env:CACHE_TTL_LLM_CLEANUP_SECONDS,7200}
  ttl_llm_expand_seconds: ${oc.env:CACHE_TTL_LLM_EXPAND_SECONDS,7200}
  ttl_qdrant_column_seconds: ${oc.env:CACHE_TTL_QDRANT_COLUMN_SECONDS,3600}
  ttl_qdrant_metric_seconds: ${oc.env:CACHE_TTL_QDRANT_METRIC_SECONDS,3600}
  ttl_es_value_seconds: ${oc.env:CACHE_TTL_ES_VALUE_SECONDS,3600}
  ttl_generate_sql_seconds: ${oc.env:CACHE_TTL_GENERATE_SQL_SECONDS,7200}
  ttl_meta_mysql_seconds: ${oc.env:CACHE_TTL_META_MYSQL_SECONDS,7200}
  prompt_version: ${oc.env:PROMPT_VERSION,v1}
  schema_version: ${oc.env:SCHEMA_VERSION,v1}
  embedding_model_version: ${oc.env:EMBEDDING_MODEL_VERSION,bge-large-zh-v1.5}
  index_version: ${oc.env:INDEX_VERSION,v1}

redis:
  host: ${oc.env:REDIS_HOST,localhost}
  port: ${oc.env:REDIS_PORT,6379}
  db: ${oc.env:REDIS_DB,0}
  password: ${oc.env:REDIS_PASSWORD,''}
  socket_timeout: ${oc.env:REDIS_SOCKET_TIMEOUT,3.0}

checkpoint:
  backend: ${oc.env:CHECKPOINT_BACKEND,postgres}
  postgres_dsn: ${oc.env:CHECKPOINT_POSTGRES_DSN,postgresql://nl2sql:nl2sql@localhost:5432/nl2sql_checkpoint}
  pool_min_size: ${oc.env:CHECKPOINT_POOL_MIN_SIZE,1}
  pool_max_size: ${oc.env:CHECKPOINT_POOL_MAX_SIZE,10}
  setup_on_start: ${oc.env:CHECKPOINT_SETUP_ON_START,true}
  retention_days: ${oc.env:CHECKPOINT_RETENTION_DAYS,30}
  sqlite_path: ${oc.env:CHECKPOINT_SQLITE_PATH,checkpoints/checkpoint.db}
  strict_msgpack: ${oc.env:LANGGRAPH_STRICT_MSGPACK,true}

recall:
  column_score_threshold: ${oc.env:RECALL_COLUMN_SCORE_THRESHOLD,0.7}
  metric_score_threshold: ${oc.env:RECALL_METRIC_SCORE_THRESHOLD,0.7}
  value_score_threshold: ${oc.env:RECALL_VALUE_SCORE_THRESHOLD,1.0}

monitoring:
  prometheus_enabled: ${oc.env:PROMETHEUS_ENABLED,true}
